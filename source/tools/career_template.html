<meta charset="utf-8">
<title>模拟自行车队 · 生涯回放</title>
<style>
  :root{--bg:#0e1116;--panel:#161b23;--line:#242c38;--text:#e6edf5;
        --dim:#8b98a8;--accent:#f5b301;--good:#3fb950;--bad:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;
    border-bottom:1px solid var(--line)}
  .badge{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;
    font-weight:700;font-size:13px}
  h1{font-size:15px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  main{padding:18px 22px;max-width:1200px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:15px 18px;margin-bottom:16px}
  h2{font-size:12px;margin:0 0 12px;color:var(--dim);font-weight:600;
    letter-spacing:.07em}
  .years{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .years button{background:#222a35;color:var(--text);border:1px solid var(--line);
    border-radius:5px;padding:7px 15px;cursor:pointer;font-size:13px}
  .years button.on{background:var(--accent);color:#111;border-color:var(--accent)}
  .kpi{display:flex;gap:30px;flex-wrap:wrap}
  .kpi div b{display:block;font-size:23px;font-weight:600;line-height:1.25}
  .kpi div span{color:var(--dim);font-size:11.5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:6px 8px;
    border-bottom:1px solid var(--line);font-size:11.5px}
  td{padding:5px 8px;border-bottom:1px solid #1b222c}
  tr.mine td{background:#1d2530}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;
    background:#232c38;color:var(--dim)}
  .up{color:var(--good)} .down{color:var(--bad)}
  .feed div{padding:4px 0;border-bottom:1px solid #1a212a;display:flex;gap:10px}
  .feed .tag{flex:0 0 62px;color:var(--dim);font-size:11px}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.85;margin-top:10px}
  .spark{height:46px;width:100%;display:block;margin:6px 0 2px}
</style>

<header>
  <div class="badge" id="badge"></div>
  <div><h1 id="tname"></h1><div class="sub" id="tsub"></div></div>
</header>

<main>
  <div class="card">
    <h2>赛季</h2>
    <div class="years" id="years"></div>
    <div class="kpi" id="kpi"></div>
    <svg class="spark" id="spark" viewBox="0 0 900 46" preserveAspectRatio="none"></svg>
    <div class="hint" id="trend"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>赛季动态</h2>
      <div class="feed" id="feed"></div>
    </div>
    <div>
      <div class="card">
        <h2>阵容变化（赛季初 → 赛季末）</h2>
        <table id="roster"></table>
      </div>
      <div class="card">
        <h2>升降级形势（三年滚动积分）</h2>
        <table id="board"></table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>本赛季战报</h2>
    <table id="results"></table>
  </div>

  <div class="card">
    <h2>这个原型在验证什么</h2>
    <div class="hint">
      前两个原型分别验证美术（三头身在 320px 下能不能看清）和战术
      （不同打法会不会带来不同结果）。这一个验证的是<b>时间</b>——
      五个赛季下来，一支队会不会长出自己的故事线：谁在成长、谁老了、
      钱从哪来又花到哪去、赞助商什么时候翻脸、什么时候差一点降级。<br><br>
      它是回放不是实况。但里面每一条动态、每一次转会、每一个成长数字，
      都是引擎真跑出来的——没有一行是为了好看编的。
    </div>
  </div>
</main>

<script>
const C = /*__CAREER__*/null;
const ART = "assets/art/";
const ROLE = {leader:"总成绩",climber:"爬坡",sprinter:"冲刺",leadout:"领骑",
  rouleur:"平路",breakaway:"突围",domestique:"工兵"};
let cur = 0;

const t = C.team;
const b = document.getElementById("badge");
b.style.background = t.primary; b.style.color = t.secondary;
b.textContent = t.short;
document.getElementById("tname").textContent = t.name;
document.getElementById("tsub").textContent =
  `${C.seasons.length} 个赛季回放 · 休赛期集训：${C.camp}`;

document.getElementById("years").innerHTML = C.seasons.map((s,i) =>
  `<button class="${i===0?'on':''}" onclick="pick(${i})">${s.year}</button>`).join("");

function pick(i){
  cur = i;
  document.querySelectorAll(".years button").forEach((b,j) =>
    b.classList.toggle("on", j===i));
  render();
}

function render(){
  const s = C.seasons[cur];

  document.getElementById("kpi").innerHTML = `
    <div><b>第 ${s.rank}</b><span>车队世界排名</span></div>
    <div><b>${s.points}</b><span>赛季积分</span></div>
    <div><b>${s.wins}</b><span>赛事冠军</span></div>
    <div><b>${s.division}</b><span>所属等级</span></div>
    <div><b>${s.budget}</b><span>预算（万）</span></div>
    <div><b style="color:${s.payroll>s.budget?'var(--bad)':'var(--good)'}">${s.payroll}</b>
      <span>薪资支出（万）</span></div>`;

  // 名次走势（名次越小越好，所以纵轴翻过来）
  const ranks = C.seasons.map(x => x.rank);
  const mx = Math.max(...ranks), mn = Math.min(...ranks);
  const pts = ranks.map((r,i) =>
    `${(i/(ranks.length-1||1)*880+10).toFixed(0)},${(6+(r-mn)/(mx-mn||1)*34).toFixed(0)}`);
  document.getElementById("spark").innerHTML =
    `<polyline points="${pts.join(" ")}" fill="none" stroke="#f5b301" stroke-width="2"/>` +
    pts.map((p,i) => {
      const [x,y] = p.split(",");
      return `<circle cx="${x}" cy="${y}" r="${i===cur?5:3}"
        fill="${i===cur?'#f5b301':'#8b98a8'}"/>`;
    }).join("");
  const first = C.seasons[0].rank, last = C.seasons[C.seasons.length-1].rank;
  document.getElementById("trend").innerHTML =
    `名次走势（上方为更好）：首季第 ${first} → 末季第 ${last}　` +
    (last < first ? `<span class="up">上升 ${first-last} 位</span>` :
     last > first ? `<span class="down">下滑 ${last-first} 位</span>` : "持平");

  document.getElementById("feed").innerHTML = s.headlines.map(h =>
    `<div><span class="tag">${h.tag||"　"}</span><span>${h.text}</span></div>`
  ).join("") || `<div class="hint">这个赛季没有值得记录的事。</div>`;

  const after = Object.fromEntries(s.roster_after.map(r => [r.id, r]));
  document.getElementById("roster").innerHTML =
    `<tr><th>车手</th><th>角色</th><th class="num">年龄</th>
      <th class="num">总评</th><th class="num">变化</th>
      <th class="num">潜力</th><th class="num">年薪</th></tr>` +
    s.roster.map(r => {
      const a = after[r.id];
      const d = a ? a.overall - r.overall : null;
      const cls = d === null ? "" : d > 0 ? "up" : d < 0 ? "down" : "";
      const txt = a === undefined ? "离队" : (d > 0 ? "+"+d : d);
      return `<tr>
        <td>${r.name}<div class="sub" style="font-size:10.5px">${r.nation}</div></td>
        <td><span class="pill">${ROLE[r.role]}</span></td>
        <td class="num">${r.age}</td>
        <td class="num">${r.overall}</td>
        <td class="num ${cls}">${txt}</td>
        <td class="num" style="color:var(--dim)">${r.potential}</td>
        <td class="num">${r.salary}</td></tr>`;
    }).join("");

  document.getElementById("board").innerHTML =
    `<tr><th>车队</th><th>等级</th><th class="num">三年积分</th><th></th></tr>` +
    C.board.map(x => `<tr class="${x.mine?'mine':''}">
      <td>${x.team}</td><td><span class="pill">${x.division}</span></td>
      <td class="num">${x.points}</td>
      <td style="color:${x.tag==='降级区'?'var(--bad)':x.tag==='升级区'?'var(--good)':'var(--dim)'}">${x.tag||""}</td>
    </tr>`).join("");

  document.getElementById("results").innerHTML =
    `<tr><th>赛事</th><th>等级</th><th>冠军</th><th>车队</th>
      <th class="num">我队最好</th></tr>` +
    s.results.map(r => `<tr class="${r.best_place===1?'mine':''}">
      <td>${r.race}</td><td><span class="pill">${r.tier}</span></td>
      <td>${r.winner}</td><td style="color:var(--dim)">${r.winner_team}</td>
      <td class="num">${r.best_place ? "第 "+r.best_place+" 名（"+r.best_name+"）" : "—"}</td>
    </tr>`).join("");
}

render();
</script>
